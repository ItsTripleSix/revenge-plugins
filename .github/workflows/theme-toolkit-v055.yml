name: Theme Toolkit v0.5.5 builder

on:
  push:
    paths:
      - '.github/workflows/theme-toolkit-v055.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate v0.5.5
        run: python3 .github/tt_build_v055.py
      - name: Commit generated plugin
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/theme-toolkit/index-v055.js plugins/theme-toolkit/manifest.json
          git commit -m 'Keep Theme Toolkit hex input focused while typing'
          git push
