name: Theme Toolkit v0.5.2 builder

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Theme Toolkit
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json

          src_path = Path('plugins/theme-toolkit/index-v051.js')
          out_path = Path('plugins/theme-toolkit/index-v052.js')
          text = src_path.read_text()

          replacements = [
              ('const { after } = vendetta.patcher;', 'const { after, before } = vendetta.patcher;'),
              ('const MessageStore = (() => { try { return findByProps("getMessage", "getMessages"); } catch { return null; } })();', 'const MessageStore = (() => { try { return findByProps("getMessage", "getMessages"); } catch { return null; } })();\n  const ChatManagerModule = (() => { try { return findByProps("MockChatManager"); } catch { return null; } })();'),
              ('let unpatchMentions = null;\n  let appStateSubscription = null;', 'let unpatchMentions = null;\n  let unpatchMentionRowRefresh = null;\n  let appStateSubscription = null;'),
              ('function patchMentionHighlights() {', '''function patchMentionRowRefresh() {
    const ChatManager = ChatManagerModule?.default;
    const proto = ChatManager?.prototype;
    if (!proto || typeof proto.determineChangeType !== "function" || typeof before !== "function") return null;
    try {
      return before("determineChangeType", proto, args => {
        try {
          const input = args?.[0];
          if (!mentionAnimationEnabled || !input?.message?.mentioned) return;
          input.forceRender = true;
        } catch {}
      });
    } catch (error) { try { console.error("[ThemeToolkit] failed to patch mention row refresh", error); } catch {} return null; }
  }

  function patchMentionHighlights() {'''),
              ('Theme Toolkit v0.5.1', 'Theme Toolkit v0.5.2'),
              ('Mention highlights now support animated color modes and attention effects. Animation only refreshes while an actual mentioned message is being rendered, then idles automatically when no mention is visible.', 'Animated mention highlights now force only mentioned message rows to refresh while visible, bypassing Discord\'s cached row data. The timer still idles automatically when no mention is visible.'),
              ('unpatchMentions = patchMentionHighlights();\n      syncMentionAnimationState();', 'unpatchMentionRowRefresh = patchMentionRowRefresh();\n      unpatchMentions = patchMentionHighlights();\n      syncMentionAnimationState();'),
              ('try { unpatchMentions?.(); } catch {}\n      unpatchFolder = null;', 'try { unpatchMentions?.(); } catch {}\n      try { unpatchMentionRowRefresh?.(); } catch {}\n      unpatchFolder = null;'),
              ('unpatchMentions = null;\n      mentionAnimationEnabled = false;', 'unpatchMentions = null;\n      unpatchMentionRowRefresh = null;\n      mentionAnimationEnabled = false;'),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Missing expected source fragment: {old[:100]}')
              text = text.replace(old, new, 1)

          out_path.write_text(text)
          raw = text.encode()
          blob_sha = hashlib.sha1(f'blob {len(raw)}\\0'.encode() + raw).hexdigest()

          manifest_path = Path('plugins/theme-toolkit/manifest.json')
          manifest = json.loads(manifest_path.read_text())
          manifest['main'] = 'index-v052.js'
          manifest['hash'] = blob_sha
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')

          Path('.github/workflows/theme-toolkit-v052.yml').unlink()
      - name: Commit v0.5.2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/theme-toolkit/index-v052.js plugins/theme-toolkit/manifest.json .github/workflows/theme-toolkit-v052.yml
          git commit -m 'Fix live mention animation row refresh'
          git push
