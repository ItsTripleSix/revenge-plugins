name: Theme Toolkit v0.6.1 probe builder

on:
  push:
    paths:
      - '.github/workflows/theme-toolkit-v061.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate v0.6.1 test
        run: python3 .github/tt_build_v061.py
      - name: Commit generated plugin
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/theme-toolkit/index-v061.js plugins/theme-toolkit/manifest.json
          git commit -m 'Add runtime probes for UI accent hooks'
          git push
