name: Theme Toolkit v0.5.3 safe builder

on:
  push:
    paths:
      - '.github/workflows/theme-toolkit-v053-safe.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate v0.5.3
        run: python3 .github/tt_build_v053.py
      - name: Commit generated plugin
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/theme-toolkit/index-v053.js plugins/theme-toolkit/manifest.json
          git commit -m 'Add safe inline mention styling to Theme Toolkit'
          git push
