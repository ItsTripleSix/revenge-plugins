name: Theme Toolkit v0.6.4 builder

on:
  push:
    paths:
      - '.github/workflows/theme-toolkit-v064.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate v0.6.4
        run: python .github/tt_build_v064.py
      - name: Commit generated plugin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/theme-toolkit/index-v064.js plugins/theme-toolkit/manifest.json
          git commit -m "Theme Toolkit v0.6.4 broad icon and pill hooks" || exit 0
          git push
